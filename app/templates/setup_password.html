{% extends "base.html" %}
{% block body %}
  <h1>Choose an admin password.</h1>
  <p>The password admin cannot be kept.</p>
  {% if error %}
    <p class="error">{{ error }}</p>
  {% endif %}
  <form method="post" action="/setup/password">
    <label>New password <input name="password" type="password" autocomplete="new-password"></label>
    <label>New password again <input name="password_again" type="password" autocomplete="new-password"></label>
    <button class="primary" type="submit">Save password</button>
  </form>
  <form method="post" action="/sign-out">
    <button type="submit">Sign out</button>
  </form>
{% endblock %}
